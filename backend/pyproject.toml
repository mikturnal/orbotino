[project]
name = "orbotino"
version = "0.1.0"
description = "Bot for Twitch and Discord"
authors = [
    { name = "mikturnal", email = "20732213+mikturnal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "discord-py>=2.4",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "spotipy>=2.26.0",
    "sqlalchemy[asyncio]>=2",
    "twitchio>=3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orbotino = "orbotino:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
